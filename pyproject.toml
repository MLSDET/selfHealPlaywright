[tool.poetry]
name = "testguardian-ai"
version = "0.1.0"
description = "Self-healing UI automation framework using Playwright + ML"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
PyYAML = "^6.0"

# UI Automation
playwright = "^1.43.0"

# ML / Data
scikit-learn = "^1.4.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
joblib = "^1.3.0"

# API Layer
fastapi = "^0.110.0"
uvicorn = "^0.29.0"

# Logging
loguru = "^0.7.2"

# Config management
pydantic = "^2.6.0"
pytest-html = "^4.2.0"
beautifulsoup4 = "^4.14.3"
xgboost = "^3.2.0"

[tool.poetry.group.dev.dependencies]

# Testing
pytest = "^8.1.0"
pytest-playwright = "^0.4.4"
pytest-cov = "^5.0.0"

# Linting & Formatting
black = "^24.3.0"
isort = "^5.13.2"
flake8 = "^7.0.0"

# Type checking
mypy = "^1.9.0"
allure-pytest = "^2.16.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-s"